name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  rust:
    name: Rust test & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: rust

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --locked -- -D warnings

  admin:
    name: Admin SPA build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci
      - run: npm run build

  # PR only: prove Dockerfile + SPA stage build (no registry write)
  docker-smoke:
    name: Docker build smoke
    if: github.event_name == 'pull_request'
    needs: [rust, admin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build (no push, load for runtime smoke)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: serpotter:smoke
          cache-from: type=gha,scope=serpotter
          # read-only cache on PR — main publish is the single cache-to writer

      - name: Run container and wait for healthy
        run: |
          docker run --name serpotter-smoke \
            --health-cmd 'curl -fsS http://127.0.0.1:8080/ready || exit 1' \
            --health-interval 2s \
            --health-start-period 5s \
            --health-retries 15 \
            -d -p 18080:8080 serpotter:smoke
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' serpotter-smoke)
            if [ "$status" = "healthy" ]; then
              echo "container healthy after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy (last status: $status)"
          docker inspect --format='{{json .State.Health}}' serpotter-smoke || true
          docker logs serpotter-smoke || true
          exit 1

      - name: Smoke /ready and /live inside container
        run: |
          docker exec serpotter-smoke curl -fsS http://127.0.0.1:8080/ready
          echo
          docker exec serpotter-smoke curl -fsS http://127.0.0.1:8080/live
          echo

      - name: Clean up smoke container
        if: always()
        run: docker rm -f serpotter-smoke

  # Main only: publish after quality gate (Merpati pattern)
  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, admin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=serpotter
          cache-to: type=gha,scope=serpotter,mode=max
