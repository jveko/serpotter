services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET:-dev-admin}
      RUST_LOG: ${RUST_LOG:-info,serpotter_api=info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: sqlite:/data/serpotter.db?mode=rwc
      # Public host serving MCP needs Host allowlist (loopback default).
      # MCP_ALLOWED_HOSTS: search.example.com,search.example.com:8080
      # Fail-closed egress when nodes empty (optional):
      # REQUIRE_OUTBOUND_PROXY: "1"
      # Nested SPA only if you bind-mount a vite-built dist with base /admin/:
      # ADMIN_SPA_DIR: /admin-dist
    volumes:
      - serpotter-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  serpotter-data:
