services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET:-dev-admin}
      RUST_LOG: ${RUST_LOG:-info,serpotter_api=info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_DIR: /data/logs
      DATABASE_URL: sqlite:/data/serpotter.db?mode=rwc
      # Optional: sync Tavily/Firecrawl credits on 15m maintenance tick (default off).
      CREDIT_SYNC_CRON: ${CREDIT_SYNC_CRON:-0}
      # Optional node multi-hold reclaim deadline (seconds; default 90 in code).
      # NODE_HOLD_TTL_SECS: "90"
      # Public host serving MCP needs Host allowlist (loopback default when unset).
      # Do NOT set MCP_ALLOWED_HOSTS to empty string — empty disables the allowlist.
      # MCP_ALLOWED_HOSTS: search.example.com,search.example.com:8080
      # Outbound is nodes-only (admin Nodes: http|https|socks5). OUTBOUND_PROXY ignored.
      # Fail-closed egress when nodes empty (optional):
      # REQUIRE_OUTBOUND_PROXY: "1"
      # Admin SPA (served at /): image bakes dist at /admin-dist, sets ADMIN_SPA_DIR.
      # Optional override (host dist must be readable by uid 10001):
      # ADMIN_SPA_DIR: /admin-dist
    volumes:
      - serpotter-data:/data
      # - ./web/dist:/admin-dist:ro
    restart: unless-stopped
    # Durable audit = stdout JSON lines (LOG_FORMAT=json). Bound the default
    # json-file driver so the log stream cannot grow unbounded (50m x 10 =
    # ~500m max on disk).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    # Graceful-shutdown drain cap is ~20s after SIGTERM; 30s leaves margin
    # (SIGKILL would orphan sqlite + SSE sessions).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  serpotter-data:
