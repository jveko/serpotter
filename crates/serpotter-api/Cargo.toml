[package]
name = "serpotter-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "serpotter_api"
path = "src/lib.rs"

[[bin]]
name = "serpotter-api"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
axum = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serpotter-auth = { workspace = true }
serpotter-core = { workspace = true }
serpotter-db = { workspace = true }
serpotter-keypool = { workspace = true }
serpotter-outbound = { workspace = true }
serpotter-product = { workspace = true }
serpotter-providers = { workspace = true }

rmcp = { workspace = true }
tower = { version = "0.5", default-features = false }
tokio = { workspace = true, features = ["time"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
http-body-util = "0.1.3"
bytes = "1"
serde_json = { workspace = true }
sqlx = { workspace = true }
serpotter-db = { workspace = true }
serpotter-keypool = { workspace = true }
serpotter-providers = { workspace = true }
serpotter-outbound = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5.2", features = ["util"] }
parking_lot = { workspace = true }
