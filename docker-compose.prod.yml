# Serpotter production stack — pull-only GHCR (no local build).
#
# Image package: ghcr.io/jveko/serpotter  (binary inside: serpotter-api)
# CI publishes linux/amd64 only — platform is pinned so arm64 hosts pull via emulation.
#
# Quick start:
#   export ADMIN_SECRET=change-me
#   # optional pin (default latest):
#   # export SERPOTTER_IMAGE_TAG=<git-sha|v1.2.3|latest>
#   # export GITHUB_REPOSITORY=jveko/serpotter
#   # export MCP_ALLOWED_HOSTS=search.example.com,search.example.com:8080
#   # export CREDIT_SYNC_CRON=1
#   # export PUBLISH_PORT=8080
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
#   curl -fsS localhost:${PUBLISH_PORT:-8080}/ready
#   curl -fsS -o /dev/null -w "%{http_code}\n" localhost:${PUBLISH_PORT:-8080}/
#
# Seed (same named volume; entrypoint = binary name):
#   docker compose -f docker-compose.prod.yml run --rm --entrypoint serpotter-api \
#     api seed-token --name local
#   docker compose -f docker-compose.prod.yml run --rm --entrypoint serpotter-api \
#     api seed-key --service tavily --key "$TAVILY_API_KEY"
#
# Stop:
#   docker compose -f docker-compose.prod.yml down
# Wipe DB volume:
#   docker compose -f docker-compose.prod.yml down -v
#
# Prefer pinning SERPOTTER_IMAGE_TAG to a bare git sha or semver in real prod.
# Do NOT set MCP_ALLOWED_HOSTS to empty string — that disables the Host allowlist.

name: serpotter-prod

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-jveko/serpotter}:${SERPOTTER_IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    ports:
      - "${PUBLISH_PORT:-8080}:8080"
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET:?set ADMIN_SECRET for prod}
      DATABASE_URL: sqlite:/data/serpotter.db?mode=rwc
      PORT: "8080"
      RUST_LOG: ${RUST_LOG:-info,serpotter_api=info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CREDIT_SYNC_CRON: ${CREDIT_SYNC_CRON:-0}
      # Baked SPA (image default); override only if you mount a custom dist.
      ADMIN_SPA_DIR: /admin-dist
      # Public MCP (optional). Leave unset for loopback-only Host allowlist.
      # MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS}
      # Fixed egress proxy for Tavily/Firecrawl/Exa (xAI always direct):
      # OUTBOUND_PROXY: ${OUTBOUND_PROXY}
      # REQUIRE_OUTBOUND_PROXY: "1"
      # KEY_MAX_INFLIGHT: "3"
      # KEY_ACQUIRE_TIMEOUT_SECS: "30"
      # KEY_HOLD_TTL_SECS: "90"
      # NODE_HOLD_TTL_SECS: "90"
      # KEY_REENABLE_AFTER_HOURS: "24"
      # REQUEST_LOG_RETENTION_DAYS: "30"
      # REQUEST_LOG_MAX_ROWS: "100000"
    volumes:
      - serpotter-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  serpotter-data:
    name: serpotter-prod-data
