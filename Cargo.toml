[workspace]
resolver = "2"
members = [
    "crates/serpotter-api",
    "crates/serpotter-auth",
    "crates/serpotter-core",
    "crates/serpotter-db",
    "crates/serpotter-keypool",
    "crates/serpotter-outbound",
    "crates/serpotter-product",
    "crates/serpotter-providers",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
getrandom = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
rmcp = { version = "2.2.0", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }

url = "2"
serpotter-auth = { path = "crates/serpotter-auth" }
serpotter-core = { path = "crates/serpotter-core" }
serpotter-db = { path = "crates/serpotter-db" }
serpotter-keypool = { path = "crates/serpotter-keypool" }
serpotter-outbound = { path = "crates/serpotter-outbound" }
serpotter-product = { path = "crates/serpotter-product" }
serpotter-providers = { path = "crates/serpotter-providers" }
