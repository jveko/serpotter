[workspace]
resolver = "2"
members = [
    "crates/serpotter-api",
    "crates/serpotter-auth",
    "crates/serpotter-core",
    "crates/serpotter-db",
    "crates/serpotter-keypool",
    "crates/serpotter-outbound",
    "crates/serpotter-providers",
    "crates/serpotter-tavily",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2"
serpotter-auth = { path = "crates/serpotter-auth" }
serpotter-core = { path = "crates/serpotter-core" }
serpotter-db = { path = "crates/serpotter-db" }
serpotter-keypool = { path = "crates/serpotter-keypool" }
serpotter-providers = { path = "crates/serpotter-providers" }
serpotter-outbound = { path = "crates/serpotter-outbound" }
serpotter-tavily = { path = "crates/serpotter-tavily" }
